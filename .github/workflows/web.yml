# Site: the ABI matches the contracts and the types check (~2 min), when the site or the contract sources change.
# It runs after a push and never blocks one; `pnpm run deploy` runs the same checks locally before shipping.
name: Web
on:
  push:
    branches: [main]
    paths: ['web/**', 'contracts/src/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'contracts/src/**', '.github/workflows/web.yml']
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge build
        working-directory: contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm abi:check
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
